<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table1</title>
    <style>
        *{
            box-sizing: border-box;
        }
        .container{
            height: 150px;
            width: 600px;
            padding: 3px;
            border: 1px solid;
            margin: 0px auto;
        }
        table{
            padding: 2px;
            margin: 0px auto;
            border: 1px solid;
            border-spacing: 3px;
        }
        td{
            border: 1px solid;
        }
        th{
            border: 1px solid;
        }
        </style>
</head>
<body>
    <div class = "container">
        <table>
<caption>Classic Movie Day</caption>
<tr>
    <td></td>
    <th>5pm</th>
    <th>7pm</th>
    <th>9pm</th>
    <th>11pm</th>
</tr>

<tr>
    <th>Screen one</th>
    <td>Star Wars</td>
    <td>Empire Strikes Back</td>
    <td>Return of the Jedi</td>
    <td>The Exorcist</td>
</tr>

<tr>
    <th>Screen two</th>
    <td colspan = "2">Dances with Wolves</td>
    <td colspan = "2">Gone with the Wind</td>
</tr>

<tr>
    <th>Screen three</th>
    <td colspan ="2">2001: A Space Odyssey</td>
    <td>The Conversation</td>
    <td>5 Easy Pieces</td>
</tr>
        </table>
    </div>
</body>
</html>
