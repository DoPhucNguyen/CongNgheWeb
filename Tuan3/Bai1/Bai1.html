<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .container {
            width: 1200px;
            min-height: 600px;
            background: linear-gradient(to bottom, #87CEEB, #4682B4);
            margin: 0 auto;
        }
        
        .header {
            width: 100%;
            height: 70px;
            padding: 15px;
            border-bottom: 6px dotted rgba(255, 255, 255, 0.8);
            position: relative;
        }
        
        .header li {
            list-style: none;
            display: inline-block;
            margin-right: 15px;
            margin-left: 15px;
            font-size: 20px;
        }
        
        .header li a {
            text-decoration: none;
            color: white;
            font-size: 28px;
            font-weight: bold;
        }
        
        .content {
            display: flex;
            width: 100%;
            min-height: 600px;
        }
        
        .left {
            flex: 1;
            min-height: 600px;
            padding: 8px;
            margin-top: 25px;
            margin-bottom: 20px;
        }
        
        .left h1 {
            color: white;
            flex: 1;
            font-size: 35px;
        }
        
        .right {
            flex: 1;
            min-height: 600px;
            padding: 10px;
        }
        
        #logo {
            right: 15px;
            top: 5px;
            position: absolute;
            font-size: 35px;
            font-weight: bold;
            color: white;
            font-family: Arial, sans-serif;
            text-shadow: 10px 10px 10px #0f2b5c, 2px 2px 0px #0f2b5c;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
            <h1 id="logo">Sky World</h1>
        </div>
        <div class="content">
            <div class="left">
                <h1>Registration Information</h1>
            </div>
            <div class="right"></div>
        </div>
        <div class="footer"></div>
    </div>
</body>

</html>
