<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }
        #container{
            border: 2px solid gray;
            width: 960px;
            height: 900px;
            
        }
        #header1{
            width: 100%;
            height: 150px;
            background-color: rgb(37, 37, 149);
        }
        #content{
            width:70%;
            height: 650px;
            
            float:left;
        }
        #content #left{
            width: 60%;
            height: 100%;
           
            float: left;
        }
        #content #right{
            width: 40%;
            height: 100%;
           
            float: left;
        }
        #aside1{
            width:30%;
            height: 650px;
            float:left;
        }
        #footer1{
            width: 100%;
            height: 100px;
            clear: both;
        }

    </style>
</head>

<body>
    <div id="container">
        <div id="header1">
            <img src="Tuan3/Bai2/flower.png">
        </div>
        <div id="content">
            <div id="left"></div>
            <div id="right"></div>
        </div>
        <div id="aside1"></div>
        <div id="footer1"></div>
    </div>
</body>

</html>
