<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai2c</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
</head>
<body>
    <div class="container border border-success">
        <div class="row g-5">
            <div class="col-6">
                <label class="form-label small fw-bold">Username*</label>
                <input type="text" class="form-control" placeholder="Choose your name">
                <label class="form-label small fw-bold">E-mail*</label>
                <input type="mail" class="form-control" placeholder="Your currently email address">
                <label class="form-label small fw-bold">Password*</label>
                <input type="password" class="form-control" placeholder="Create a password">  
                <label class="form-label small fw-bold">Fullname*</label>
                <input type="text" class="form-control" placeholder="Your First name and Last name">
                <div class="mt-4">
                    <label class="form-label small fw-bold">Gender*</label><br>
                    <label class="small"><input type="radio" name="gender">Male</label>
                    <label class="small"><input type="radio" name="gender">Female</label>
                </div>
            </div>
            <div class="col-6">
                <label class="form-label small fw-bold">Company name*</label>
                <input type="text" class="form-control" placeholder="Your company name">
                <label class="form-label small fw-bold">Category*</label>
                <input type="text" class="form-control" placeholder="Skill category">
                <label class="form-label small fw-bold">Contact number*</label>
                <input type="text" class="form-control" placeholder="Provide your number">
                <label class="form-label small fw-bold">Your Location*</label>
                <input type="text" class="form-control" placeholder="Your Province and City">
                <input type="checkbox" class="mt-3">
                <label class="form-label fw-bold small">Agree with the items and conditions</label>
                <div class="mt-5 mb-3 d-flex gap-2">
                    <input type="submit" class="bg-success text-light" value="Signup">
                    <p class="align-self-center">or</p>
                    <input type="submit"class="bg-primary text-light" value="Signup with Facebook" >
                </div>
            </div>
        </div>

    </div>
</body>
</html>
